name: Cron — fines

# Daily. Fine generation only becomes due once an event's check-in window has
# closed, and the run is idempotent (`events.finesIssuedAt` plus the unique
# (userId, eventId) index), so the exact hour does not matter. This runs here
# rather than in vercel.json because the Vercel project is on Hobby, which
# allows only two daily cron jobs; the signature purge keeps one of those slots.
#
# Repository settings this needs:
#   secret   CRON_SECRET — same value as the deployment's environment (D-04)
#   variable SITE_URL    — set at cutover to the production domain. Until it is
#                          set, this workflow skips quietly instead of failing
#                          against a domain that does not exist yet.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  fines:
    runs-on: ubuntu-latest
    steps:
      - name: Generate fines for closed events
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "CRON_SECRET / SITE_URL are not both configured for this repository yet — skipping"
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/event-fines")
          echo "HTTP $code"
          cat /tmp/out.json || true
          test "$code" = "200"
